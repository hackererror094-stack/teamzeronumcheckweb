kind = "web"
previewPath = "/"
title = "WA Number Cleaner"
version = "1.0.0"
id = "artifacts/wa-cleaner"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22384

[services.development]
run = "pnpm --filter @workspace/wa-cleaner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wa-cleaner", "run", "build" ]
publicDir = "artifacts/wa-cleaner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22384"
BASE_PATH = "/"
