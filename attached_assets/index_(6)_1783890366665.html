<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Number Monitor & Cleaner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <span>🛡️</span> WA Number Cleaner
            </h1>
            <span class="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/20 font-medium">
                System Active
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1 bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 backdrop-blur-sm shadow-xl flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold mb-2 text-white">Add Bulk Numbers</h2>
                <p class="text-xs text-slate-400 mb-4">Har number ko nayi line me likhein (Format: 923xxxxxxxx).</p>
                <textarea 
                    id="numberInput" 
                    rows="12" 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-sm font-mono text-emerald-400 focus:outline-none focus:border-emerald-500 transition-colors placeholder:text-slate-600 resize-none"
                    placeholder="923001234567&#10;923119876543"
                ></textarea>
            </div>
            <button 
                onclick="startChecking()" 
                id="startBtn"
                class="w-full mt-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-3 px-4 rounded-xl transition-all duration-200 cursor-pointer shadow-lg shadow-emerald-500/20 text-center"
            >
                Start Verification & Auto-Delete
            </button>
        </div>

        <div class="lg:col-span-2 flex flex-col gap-6">
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-4 text-center">
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Scanned</p>
                    <p id="totalCount" class="text-2xl font-bold mt-1 text-blue-400">0</p>
                </div>
                <div class="bg-emerald-500/5 border border-emerald-500/20 rounded-xl p-4 text-center">
                    <p class="text-xs font-medium text-emerald-400 uppercase tracking-wider">Active (Saved)</p>
                    <p id="activeCount" class="text-2xl font-bold mt-1 text-emerald-400">0</p>
                </div>
                <div class="bg-rose-500/5 border border-rose-500/20 rounded-xl p-4 text-center">
                    <p class="text-xs font-medium text-rose-400 uppercase tracking-wider">Deleted (Issue)</p>
                    <p id="deletedCount" class="text-2xl font-bold mt-1 text-rose-400">0</p>
                </div>
            </div>

            <div class="flex-1 bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 backdrop-blur-sm shadow-xl flex flex-col min-h-[350px]">
                <h2 class="text-lg font-semibold mb-4 text-white flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live Log Monitor
                </h2>
                <div class="flex-1 overflow-y-auto bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs space-y-2 max-h-[350px]" id="logConsole">
                    <div class="text-slate-500">// System ready. Waiting for input...</div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-950/20 py-4 text-center text-xs text-slate-500">
        &copy; 2026 WA Automation Clean-up System.
    </footer>

    <script>
        async function startChecking() {
            const input = document.getElementById('numberInput').value.trim();
            if (!input) {
                alert('Meharbani karke pehle kuch numbers enter karein!');
                return;
            }

            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerText = "Processing...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            const numbers = input.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            const logConsole = document.getElementById('logConsole');
            
            document.getElementById('totalCount').innerText = numbers.length;
            logConsole.innerHTML = `<div class="text-blue-400">[INFO] Real-time scanning started for ${numbers.length} numbers...</div>`;

            let active = 0;
            let deleted = 0;

            for (let num of numbers) {
                try {
                    const response = await fetch('/api/verify-number', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ number: num })
                    });
                    
                    const data = await response.json();

                    if (data.status === 'deleted') {
                        deleted++;
                        document.getElementById('deletedCount').innerText = deleted;
                        logConsole.innerHTML += `<div class="text-rose-400">[DELETED] ${num} -> Reason: ${data.reason}</div>`;
                    } else if (data.status === 'error') {
                         logConsole.innerHTML += `<div class="text-amber-500">[ERROR] ${num} -> ${data.reason}</div>`;
                    } else {
                        active++;
                        document.getElementById('activeCount').innerText = active;
                        logConsole.innerHTML += `<div class="text-emerald-400">[ACTIVE] ${num} -> ${data.reason} (Saved)</div>`;
                    }
                } catch (err) {
                    logConsole.innerHTML += `<div class="text-amber-500">[ERROR] Connection failed for ${num}. Is your Node.js server running?</div>`;
                }
                logConsole.scrollTop = logConsole.scrollHeight;
            }

            btn.disabled = false;
            btn.innerText = "Start Verification & Auto-Delete";
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            logConsole.innerHTML += `<div class="text-emerald-300 mt-4">[DONE] All numbers processed successfully.</div>`;
        }
    </script>
</body>
</html>
