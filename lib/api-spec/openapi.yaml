openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whatsapp
    description: WhatsApp connection and number verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /wa/status:
    get:
      operationId: getWaStatus
      tags: [whatsapp]
      summary: Get WhatsApp connection status
      description: Returns current connection status and QR code if not connected
      responses:
        "200":
          description: Status returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaStatus"

  /wa/disconnect:
    post:
      operationId: disconnectWa
      tags: [whatsapp]
      summary: Disconnect WhatsApp
      description: Logs out and disconnects the current WhatsApp session
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisconnectResult"

  /wa/verify-number:
    post:
      operationId: verifyNumber
      tags: [whatsapp]
      summary: Verify a phone number on WhatsApp
      description: Checks whether a given number is registered on WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumberInput"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    WaStatus:
      type: object
      properties:
        connected:
          type: boolean
        qr:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
      required:
        - connected

    DisconnectResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    NumberInput:
      type: object
      properties:
        number:
          type: string
      required:
        - number

    VerifyResult:
      type: object
      properties:
        status:
          type: string
          enum: [active, deleted, error]
        reason:
          type: string
        number:
          type: string
      required:
        - status
        - reason
        - number
